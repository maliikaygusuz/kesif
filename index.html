    --paper:#f1efe6;
    --card:#faf9f4;
    --line:#cdc6b4;
    --line-soft:#e3ddcb;
    --copper:#b5541f;
    --copper-soft:#f0ddce;
    --steel:#2f5d84;
    --steel-soft:#dbe6ee;
    --warn:#8a4b12;
    --warn-bg:#f7e6d2;
    --danger:#a13a3a;
    --danger-bg:#f5dede;
    --ok:#3f6b4c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper),var(--paper)),
      repeating-linear-gradient(0deg, rgba(28,43,58,0.035) 0px, rgba(28,43,58,0.035) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(28,43,58,0.035) 0px, rgba(28,43,58,0.035) 1px, transparent 1px, transparent 28px);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  header.app{
    background:var(--ink);
    color:var(--paper);
    padding:16px 16px 14px;
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:3px solid var(--copper);
  }
  header.app .row1{display:flex;align-items:center;gap:10px;}
  header.app h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
  header.app .sub{font-size:11.5px;color:#b9c4cd;margin-top:3px;font-family:'IBM Plex Mono',monospace;}
  .backbtn{
    background:transparent;border:1.5px solid #56697a;color:var(--paper);
    border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit;
    display:flex;align-items:center;gap:5px;flex-shrink:0;
  }
  .backbtn:active{background:#2a3c4e;}
  main{max-width:640px;margin:0 auto;padding:14px 12px 8px;}

  /* ---- Okul listesi ---- */
  .school-card{
    background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .school-card .name{font-weight:600;font-size:15.5px;}
  .school-card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
  .school-card .arrow{color:var(--copper);font-size:20px;flex-shrink:0;}
  .newschool{
    background:var(--copper);color:#fff;border:none;border-radius:10px;
    padding:14px;width:100%;font-size:15px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;
  }
  .newschool:active{background:#9a4517;}
  .databtn-row{display:flex;gap:8px;margin-top:8px;}
  .databtn{
    flex:1;background:var(--card);color:var(--ink-soft);border:1.5px solid var(--line);border-radius:10px;
    padding:11px 8px;font-size:12.5px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .databtn:active{background:var(--line-soft);}
  .empty-hint{
    text-align:center;color:var(--ink-soft);font-size:13.5px;padding:36px 20px;
    border:1.5px dashed var(--line);border-radius:10px;margin-bottom:12px;
  }

  /* ---- Özet çubuğu ---- */
  .summary-bar{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--line);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;
    margin-bottom:14px;position:sticky;top:74px;z-index:15;
  }
  .summary-bar .cell{background:var(--ink);color:var(--paper);padding:9px 6px;text-align:center;}
  .summary-bar .cell .num{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;display:block;}
  .summary-bar .cell .lbl{font-size:9.5px;color:#a9b7c2;text-transform:uppercase;letter-spacing:.4px;margin-top:2px;display:block;}
  .summary-bar .cell.accent{background:var(--copper);}
  .summary-bar .cell.accent .lbl{color:#f3d9c9;}
  .summary-bar .cell.steel{background:var(--steel);}
  .summary-bar .cell.steel .lbl{color:#cfe0ec;}

  .sys-card{
    background:var(--card);border:1.5px solid var(--copper);border-radius:10px;margin-bottom:14px;overflow:hidden;
  }
  .sys-head{
    display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--copper-soft);
    font-weight:600;font-size:13.5px;color:var(--copper);cursor:pointer;
  }
  .sys-body{padding:12px 13px 14px;}
  .sys-body h4{margin:0 0 6px;font-size:12.5px;color:var(--ink);}
  .sys-result{
    display:flex;align-items:baseline;gap:10px;background:#fff;border:1.5px solid var(--line-soft);
    border-radius:8px;padding:9px 11px;margin-bottom:6px;
  }
  .sys-result.warn2{border-color:var(--warn);background:var(--warn-bg);}
  .sys-tip{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:var(--copper);}
  .sys-result.warn2 .sys-tip{color:var(--warn);}
  .sys-desc{font-size:11.5px;color:var(--ink-soft);}
  .sys-line{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:4px;}
  .sys-cite{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8a8264;display:block;margin-top:2px;}
  .sys-list{margin:6px 0 0;padding-left:18px;}
  .sys-list li{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:7px;}
  .sys-list li b{color:var(--ink);}

  .schoolname-edit{
    width:100%;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;
    border:none;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);
    padding:4px 2px 8px;margin-bottom:2px;
  }
  .schoolname-edit:focus{outline:none;border-color:var(--copper);}
  .school-sub{font-size:11.5px;color:var(--ink-soft);margin:0 2px 14px;font-family:'IBM Plex Mono',monospace;}

  /* ---- Kat kartı ---- */
  .floor{
    background:var(--card);border:1.5px solid var(--line);border-radius:10px;
    margin-bottom:12px;overflow:hidden;
  }
  .floor-head{
    display:flex;align-items:center;gap:6px;padding:11px 12px;background:#eeead9;
    border-bottom:1.5px solid var(--line);
  }
  .floor-title{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0;}
  .floor-chevron{font-size:10px;color:var(--ink-soft);flex-shrink:0;width:12px;text-align:center;transition:transform .15s;}
  .floor-name{
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .floor-edit{background:none;border:none;color:var(--ink-soft);font-size:14px;padding:2px 5px;flex-shrink:0;}
  .floor-del{
    background:none;border:none;color:var(--danger);font-size:18px;padding:2px 4px;flex-shrink:0;
  }
  .floor-body{padding:10px 10px 12px;}
  .room-row{
    border:1.5px solid var(--line-soft);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:#fff;
  }
  .room-row .top{display:flex;gap:8px;align-items:flex-start;}
  .room-row .rlabel{flex:1;min-width:0;}
  .room-row .rlabel .name{font-size:13.5px;font-weight:600;line-height:1.3;}
  .room-row .rlabel .cat{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .room-del{background:none;border:none;color:var(--danger);font-size:17px;padding:0 2px;flex-shrink:0;}
  .room-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:7px;overflow:hidden;}
  .stepper button{width:28px;height:28px;background:#f2f0e6;border:none;font-size:15px;color:var(--ink);font-family:monospace;}
  .stepper button:active{background:var(--line-soft);}
  .stepper .val{width:30px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13.5px;}
  .stepper-label{font-size:10.5px;color:var(--ink-soft);margin-right:2px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;
    white-space:nowrap;
  }
  .badge.data{background:var(--copper-soft);color:var(--copper);}
  .badge.enerji{background:#e9e3d0;color:#6b5a2e;}
  .badge.ap{background:var(--steel-soft);color:var(--steel);}
  .badge.excl{background:var(--danger-bg);color:var(--danger);}
  .cap-warn{font-size:10.5px;color:var(--warn);margin-top:5px;background:var(--warn-bg);padding:3px 7px;border-radius:5px;display:inline-block;}
  .note-input{
    width:100%;border:none;border-top:1px dashed var(--line-soft);margin-top:8px;padding-top:6px;
    font-size:11.5px;font-family:inherit;color:var(--ink-soft);background:transparent;
  }
  .note-input:focus{outline:none;}
  .floor-summary{
    display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px 10px;font-size:11.5px;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;border-top:1px dashed var(--line-soft);
  }
  .floor-summary b{color:var(--ink);}

  .add-room-btn, .add-floor-btn{
    width:100%;border:1.5px dashed var(--copper);color:var(--copper);background:transparent;
    border-radius:8px;padding:10px;font-size:13.5px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .add-room-btn:active,.add-floor-btn:active{background:var(--copper-soft);}
  .add-floor-btn{margin-bottom:0;}

  /* ---- Bina kartı (okul > bina > kat > oda) ---- */
  .building{
    background:var(--card);border:1.5px solid var(--steel);border-radius:11px;
    margin-bottom:14px;overflow:hidden;
  }
  .building-head{
    display:flex;align-items:center;gap:6px;padding:12px 13px;background:var(--steel-soft);
    border-bottom:1.5px solid var(--steel);
  }
  .building-title{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0;}
  .building-chevron{font-size:10px;color:var(--steel);flex-shrink:0;width:12px;text-align:center;}
  .building-name{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .building-name .tag{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;color:var(--steel);
    background:#fff;border-radius:5px;padding:1px 6px;margin-right:7px;vertical-align:2px;
  }
  .building-edit{background:none;border:none;color:var(--ink-soft);font-size:14px;padding:2px 5px;flex-shrink:0;}
  .building-del{background:none;border:none;color:var(--danger);font-size:18px;padding:2px 4px;flex-shrink:0;}
  .building-body{padding:12px 12px 14px;background:#f5f2e6;}
  .building-summary{
    display:flex;gap:14px;flex-wrap:wrap;padding:9px 13px 10px;font-size:11.5px;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;border-top:1px dashed var(--steel);
  }
  .building-summary b{color:var(--ink);}
  .add-building-btn2{
    width:100%;border:1.5px dashed var(--steel);color:var(--steel);background:transparent;border-radius:9px;
    padding:13px;font-size:14px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px;
  }
  .add-building-btn2:active{background:var(--steel-soft);}

  .akilli-toggle{
    display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-soft);
  }
  .akilli-toggle .lbl{font-size:11.5px;color:var(--ink-soft);}
  .akilli-toggle button{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);
    border-radius:7px;padding:5px 11px;background:#fff;color:var(--ink-soft);
  }
  .akilli-toggle button.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);}

  /* ---- Resmi Altyapı Formu (bina bilgileri) ---- */
  .form-card{
    background:var(--card);border:1.5px solid var(--steel);border-radius:10px;margin-bottom:14px;overflow:hidden;
  }
  .form-head{
    display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--steel-soft);
    font-weight:600;font-size:13.5px;color:var(--steel);cursor:pointer;
  }
  .form-body{padding:12px 12px 4px;}
  .form-intro{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 12px;}
  .building-block{
    border:1.5px solid var(--line-soft);border-radius:9px;padding:11px 11px 4px;margin-bottom:12px;background:#fff;
  }
  .building-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .building-block-head b{font-size:13px;color:var(--ink);}
  .building-block-head button{background:none;border:none;color:var(--danger);font-size:16px;padding:0 3px;}
  .field-row{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;}
  .field-row label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .field-row label .hint{font-weight:400;color:#9a9070;font-size:9.5px;display:block;margin-top:1px;}
  .field-row input, .field-row select{
    border:1.5px solid var(--line);border-radius:7px;padding:8px 9px;font-size:13px;font-family:inherit;
    background:#fff;color:var(--ink);width:100%;
  }
  .field-row input:focus, .field-row select:focus{outline:none;border-color:var(--steel);}
  .auto-value{
    border:1.5px solid var(--line-soft);border-radius:7px;padding:8px 9px;font-size:13px;
    background:#efece0;color:var(--ink-soft);width:100%;
  }
  .field-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .add-building-btn{
    width:100%;border:1.5px dashed var(--steel);color:var(--steel);background:transparent;border-radius:8px;
    padding:10px;font-size:13.5px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;
  }
  .add-building-btn:active{background:var(--steel-soft);}
  .kurum-block h4{margin:2px 0 8px;font-size:12.5px;color:var(--ink);}

  /* ---- Oda ekleme paneli (arama) ---- */
  .picker-backdrop{
    position:fixed;inset:0;background:rgba(20,28,36,.5);z-index:50;display:flex;align-items:flex-end;
  }
  .picker{
    background:var(--paper);width:100%;max-height:85vh;border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;border-top:3px solid var(--copper);
  }
  .picker-head{padding:14px 14px 10px;border-bottom:1.5px solid var(--line);}
  .picker-head h3{margin:0 0 8px;font-size:15px;}
  .picker-head input{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
    font-size:14.5px;font-family:inherit;background:#fff;
  }
  .picker-head input:focus{outline:none;border-color:var(--copper);}
  .picker-list{overflow-y:auto;padding:6px 8px;flex:1;}
  .picker-item{
    padding:10px 10px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;
    align-items:center;gap:8px;
  }
  .picker-item .pname{font-size:13.5px;font-weight:600;}
  .picker-item .pcat{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .picker-item .ptags{display:flex;gap:4px;flex-shrink:0;}
  .picker-item.excluded{opacity:.7;}
  .picker-close{
    padding:12px;text-align:center;font-size:13.5px;color:var(--ink-soft);border-top:1.5px solid var(--line);
    background:var(--card);
  }
  .picker-custom{
    margin:8px 8px 14px;padding:10px;border:1.5px dashed var(--line);border-radius:8px;font-size:12.5px;
    color:var(--ink-soft);text-align:center;
  }
  .picker-custom button{
    margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:7px;padding:8px 14px;
    font-size:12.5px;font-family:inherit;
  }

  /* ---- Alt eylemler ---- */
  .bottom-actions{display:flex;gap:8px;margin-top:6px;}
  .action-btn{
    flex:1;border-radius:8px;padding:11px;font-size:13px;font-weight:600;font-family:inherit;border:none;
  }
  .action-btn.copy{background:var(--steel);color:#fff;}
  .action-btn.del{background:transparent;color:var(--danger);border:1.5px solid var(--danger-bg);}

  /* ---- Referans paneli ---- */
  .ref-toggle{
    text-align:center;font-size:12px;color:var(--steel);padding:10px;text-decoration:underline;
  }
  .ref-panel{
    background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;
    font-size:12px;
  }
  .ref-panel table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .ref-panel td{padding:4px 2px;border-bottom:1px solid var(--line-soft);}
  .ref-panel td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .ref-panel h4{margin:10px 0 4px;font-size:12.5px;}
  .ref-note{color:var(--ink-soft);font-size:11px;margin-top:8px;line-height:1.5;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:12.5px;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }

  .installbtn{
    margin-left:auto;flex-shrink:0;background:var(--copper);color:#fff;border:none;border-radius:8px;
    padding:8px 11px;font-size:12px;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:6px;
  }
  .installbtn:active{background:#9a4517;}

  .installbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--ink);color:var(--paper);border-top:3px solid var(--copper);
    padding:11px 14px;display:flex;align-items:center;gap:10px;
    padding-bottom:calc(11px + env(safe-area-inset-bottom));
  }
  .installbar .txt{flex:1;font-size:12.5px;line-height:1.35;}
  .installbar .txt b{color:#fff;}
  .installbar button{
    flex-shrink:0;background:var(--copper);color:#fff;border:none;border-radius:8px;
    padding:10px 13px;font-size:12.5px;font-weight:600;font-family:inherit;white-space:nowrap;
  }
  .installbar button:active{background:#9a4517;}
  .installbar .closex{
    flex-shrink:0;background:transparent;border:none;color:#8a97a3;font-size:18px;padding:2px 4px;
  }
  body.has-installbar{padding-bottom:64px;}
  .install-modal-backdrop{
    position:fixed;inset:0;background:rgba(20,25,32,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;
  }
  .install-modal{
    background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 20px 26px;
    max-height:82vh;overflow-y:auto;
  }
  .install-modal h3{margin:0 0 4px;font-size:16.5px;color:var(--ink);}
  .install-modal .sub2{font-size:12px;color:var(--ink-soft);margin-bottom:16px;font-family:'IBM Plex Mono',monospace;}
  .install-modal .steps{list-style:none;margin:0 0 16px;padding:0;}
  .install-modal .steps li{
    display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-size:13.5px;color:var(--ink);line-height:1.45;
  }
  .install-modal .steps li .num{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--copper);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:700;
  }
  .install-modal .steps li b{color:var(--copper);}
  .install-modal .closebtn{
    width:100%;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:13px;
    font-size:14px;font-weight:600;font-family:inherit;
  }
  .install-modal .note{
    font-size:11.5px;color:var(--ink-soft);background:var(--warn-bg);border:1px solid var(--warn);
    border-radius:8px;padding:9px 11px;margin-bottom:16px;line-height:1.5;
  }
</style>
</head>
<body>
<header class="app">
  <div class="row1">
    <button class="backbtn" id="backBtn" style="display:none;" onclick="goList()">‹ Okullar</button>
    <div>
      <h1 id="headerTitle">Saha Keşif — Data Ucu Hesap Aracı</h1>
      <div class="sub" id="headerSub">Faz-4 Yerel Alan Ağı Teknik Şartnamesi · madde 6</div>
    </div>
    <button class="installbtn" id="installBtn" onclick="handleInstallClick()">📲 Ana Ekrana Ekle</button>
  </div>
</header>

<div class="installbar" id="installBar" style="display:none;">
  <div class="txt"><b>Bu aracı uygulama gibi kullan.</b><br>Telefonunun ana ekranına ekle, tarayıcı açmadan tek dokunuşla gir.</div>
  <button onclick="handleInstallClick()">Ekle</button>
  <button class="closex" onclick="dismissInstallBar()">✕</button>
</div>

<script>

let SCHOOLS = {};       // {id: {id,name,createdAt,floors:[...]}}
let CURRENT_ID = null;

let PICKER_QUERY = '';

const STORAGE_KEY = 'lan-survey-schools-v1';

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ SCHOOLS = JSON.parse(raw); }
  }catch(e){ SCHOOLS = {}; }
  migrateSchools();
}

// Eski veri yapısı: okul -> kat[]. Yeni yapı: okul -> bina[] -> kat[].
// Eski kayıtları kaybetmeden "Bina 1" altına taşır.
function migrateSchools(){
  let changed = false;
  Object.values(SCHOOLS).forEach(s=>{
    if(!s.buildings){
      s.buildings = (s.floors && s.floors.length) ? [{id:uid(), name:'Bina 1', open:true, floors:s.floors}] : [];
      delete s.floors;
      changed = true;
    }
  });
  if(changed) saveData();
}

async function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(SCHOOLS)); }
  catch(e){ console.error('Kayıt hatası', e); showToast('Kayıt başarısız oldu'); }
}

/* ---- Dışa / İçe aktarma (cihazlar arası taşıma) ---- */
window.exportData = function(){
  const data = JSON.stringify(SCHOOLS, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'saha-kesif-yedek-'+stamp+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Yedek dosyası indirildi');
};
window.triggerImport = function(){
  const input = document.getElementById('importFile');
  if(input) input.click();
};
window.importDataFile = function(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ showToast('Dosya okunamadı, geçersiz JSON'); input.value=''; return; }
    if(typeof parsed !== 'object' || parsed===null){ showToast('Dosya formatı tanınmadı'); input.value=''; return; }
    const incomingCount = Object.keys(parsed).length;
    const ok = confirm(incomingCount+' okul içe aktarılacak. Aynı isimli/ID\'li okullar mevcut verilerin üzerine yazılır, diğerleri eklenir. Devam edilsin mi?');
    if(!ok){ input.value=''; return; }
    SCHOOLS = Object.assign({}, SCHOOLS, parsed);
    saveData();
    VIEW='list'; CURRENT_ID=null;
    render();
    showToast('İçe aktarma tamamlandı');
    input.value='';
  };
  reader.readAsText(file);
};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================= HESAPLAMALAR ================= */
function computeRoom(room){
  let perData=0, enerji=0, ap=0, excluded=false, capped=false;
  if(room.custom){
    perData = Math.max(0, Math.min(room.customData||0, 5));
    enerji = room.customEnerji?1:0;
    ap = room.customAp?1:0;
  } else {
    const entry = CATALOG.find(e=>e.id===room.catalogId);
    if(!entry) return {perData:0,enerji:0,ap:0,excluded:false,capped:false,dataTotal:0,enerjiTotal:0,apTotal:0};
    if(entry.excluded){ excluded = true; }
    else{
      const cat = CAT_BY_KEY[entry.catKey];
      if(entry.dataOverride!=null){ perData = entry.dataOverride; }
      else if(cat.data==='p1'){
        const raw = (room.personel||0)+1;
        perData = Math.min(raw,5);
        capped = raw>5;
      } else { perData = cat.data; }
      ap = cat.ap;
      // BT Sınıfı: enerji ucu yalnızca sınıfta akıllı tahta varsa eklenir.
      enerji = (entry.catKey==='bt') ? (room.akilliTahta?1:0) : cat.enerji;
    }
  }
  const adet = room.adet||1;
  return {perData, enerji, ap, excluded, capped, dataTotal:perData*adet, enerjiTotal:enerji*adet, apTotal:ap*adet};
}
function computeFloor(floor){
  let data=0,enerji=0,ap=0,rooms=0;
  (floor.rooms||[]).forEach(r=>{ const c=computeRoom(r); data+=c.dataTotal; enerji+=c.enerjiTotal; ap+=c.apTotal; rooms+=(r.adet||1); });
  return {data,enerji,ap,rooms};
}
function computeBuilding(building){
  let data=0,enerji=0,ap=0,rooms=0,floors=0;
  (building.floors||[]).forEach(f=>{ const c=computeFloor(f); data+=c.data; enerji+=c.enerji; ap+=c.ap; rooms+=c.rooms; floors++; });
  return {data,enerji,ap,rooms,floors};
}
function computeSchool(school){
  let data=0,enerji=0,ap=0,rooms=0,floors=0;
  (school.buildings||[]).forEach(b=>{ const c=computeBuilding(b); data+=c.data; enerji+=c.enerji; ap+=c.ap; rooms+=c.rooms; floors+=c.floors; });
  return {data,enerji,ap,rooms,floors,buildings:(school.buildings||[]).length};
}
function computeCategoryTotals(school){
  const totals = {};
  (school.buildings||[]).forEach(building=>{
    (building.floors||[]).forEach(floor=>{
      (floor.rooms||[]).forEach(room=>{
        if(room.custom) return;
        const entry = CATALOG.find(e=>e.id===room.catalogId);
        if(!entry || entry.excluded || !entry.catKey) return;
        const k = entry.catKey;
        if(!totals[k]) totals[k] = {adet:0, personel:0};
        totals[k].adet += (room.adet||1);
        totals[k].personel += (room.personel||0);
      });
    });
  });
  return totals;
}

// Belirli bir kat id'sini, hangi binaya ait olduğuyla birlikte bulur.
function findFloor(floorId){
  const s = SCHOOLS[CURRENT_ID];
  if(!s) return null;
  for(const b of (s.buildings||[])){
    const f = (b.floors||[]).find(x=>x.id===floorId);
    if(f) return {building:b, floor:f};
  }
  return null;
}

// Fatih Enerji Panosu tipi — madde 35.11.15-19: derslik priz sayısına (=enerji ucu) göre belirlenir.
// Madde 35.11.8: 67 ve üzeri derslikte ikinci pano kurulur (ana pano Tip-3/4, ikinci pano Tip-1/2).
function panoInfo(enerjiUcu){
  if(enerjiUcu<=0) return {durum:'yok', mesaj:'Bu okulda enerji ucu (derslik prizi) girilmedi — Fatih Enerji Panosu gerekmiyor.'};
  if(enerjiUcu<=18) return {durum:'tek', tip:1, limit:18};
  if(enerjiUcu<=30) return {durum:'tek', tip:2, limit:30};
  if(enerjiUcu<=48) return {durum:'tek', tip:3, limit:48};
  if(enerjiUcu<=66) return {durum:'tek', tip:4, limit:66};
  return {durum:'cift', anaTip:'3 veya 4', ikinciTip:'1 veya 2'};
}

  {tip:'Tümü', kural:'Kabinetten çıkacak data kablolaması 90 metreyi aşarsa ikinci bir kabinet planlanır.', madde:'madde 7.4'},
];

/* ================= RENDER ================= */
const app = document.getElementById('app');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function render(){
  document.getElementById('backBtn').style.display = VIEW==='detail' ? 'flex':'none';
  if(VIEW==='list'){
    document.getElementById('headerTitle').textContent = 'Saha Keşif — Data Ucu Hesap Aracı';
    document.getElementById('headerSub').textContent = 'Faz-4 Yerel Alan Ağı Teknik Şartnamesi · madde 6';
    renderList();
  } else {
    const s = SCHOOLS[CURRENT_ID];
    document.getElementById('headerTitle').textContent = s ? s.name : 'Okul';
    document.getElementById('headerSub').textContent = 'Kat ve sınıf bazlı data ucu dökümü';
    renderDetail();
  }
  if(PICKER_FOR){ renderPicker(); }
}

function renderList(){
  const ids = Object.keys(SCHOOLS).sort((a,b)=> (SCHOOLS[b].createdAt||0)-(SCHOOLS[a].createdAt||0));
  let html = '';
  if(ids.length===0){
    html += `<div class="empty-hint">Henüz kayıtlı okul yok.<br>Keşfe başlamak için aşağıdan yeni okul ekle.</div>`;
  } else {
    ids.forEach(id=>{
      const s = SCHOOLS[id];
      const t = computeSchool(s);
      html += `<div class="school-card" onclick="openSchool('${id}')">
        <div>
          <div class="name">${esc(s.name)}</div>
          <div class="meta">${t.buildings} bina · ${t.floors} kat · ${t.rooms} oda · ${t.data} data ucu</div>
        </div>
        <div class="arrow">›</div>
      </div>`;
    });
  }
  html += `<button class="newschool" onclick="createSchool()">+ Yeni Okul Ekle</button>`;
  html += `<div class="databtn-row">
    <button class="databtn" onclick="exportData()">⭳ Dışa Aktar</button>
    <button class="databtn" onclick="triggerImport()">⭱ İçe Aktar</button>
  </div>`;
  html += `<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importDataFile(this)">`;
  html += `<div class="ref-toggle" onclick="toggleRef()">${window.__refOpen?'Referans tabloyu gizle':'Şartname referans tablosunu göster'}</div>`;
  if(window.__refOpen) html += renderRefPanel();
  app.innerHTML = html;
}

function renderRefPanel(){
  let rows = CATEGORIES.map(c=>{
    const dtxt = c.data==='p1' ? 'Personel + 1' : c.data+' data ucu';
    const extra = [];
    if(c.enerji) extra.push('1 enerji ucu');
    if(c.ap) extra.push('1 AP ucu');
    return `<tr><td>${esc(c.name)}</td><td>${dtxt}${extra.length?' · '+extra.join(' · '):''}</td></tr>`;
  }).join('');
  return `<div class="ref-panel">
    <h4>Standart mekân — data ucu tablosu</h4>
    <table>${rows}</table>
    <div class="ref-note">
      • Bir odaya çekilecek data ucu hiçbir şekilde 5'i geçmez.<br>
      • Enerji ucu yalnızca derslik (ve derslik sayılan, etkileşimli tahtası kurulu/kurulacak alanlar) için yapılır.<br>
      • "P+1" = odayı kullanan, masası ve bilgisayarı olan personel sayısı + 1.<br>
      • BT Sınıfı: 1 data ucu + 1 AP her zaman eklenir; enerji ucu yalnızca sınıfta akıllı tahta varsa (oda kartındaki "Akıllı Tahta" seçimiyle) eklenir.<br>
      • Oda ekle ekranındaki arama kutusuna sahada gördüğün ismi yazarsan (ör. "Kalem Odası", "Fen Odası") 64 kalemlik şartname eşleştirme listesinden otomatik kategori bulunur; data ucu çekilmeyecek 108 alan da listede uyarılı görünür.
    </div>
  </div>`;
}

      <div class="sys-cite">Kaynak: madde 35.11.8, 35.11.15–35.11.19</div>`;

const KULLANIM_SECENEKLERI = ['Ana Bina','Ek Bina','Atölye'];
const KABINET_TURU_SECENEKLERI = ['','42U','26U','16U','9U','4U'];
const GUZERGAH_SECENEKLERI = ['','Logar','Gerdirme','Direk','Kazı','Uzak Bina'];

function ensureBuildingInfo(s){
  if(!s.buildingInfo){
    const b0 = (s.buildings && s.buildings[0]) || {};
    s.buildingInfo = {
      cbsNo: b0.cbsNo||'', kullanim: b0.kullanim||'Ana Bina', sistemOdasi: b0.sistemOdasi||0,
      kabinetTuru: b0.kabinetTuru||'', baglanti: b0.baglanti||'', mesafe: b0.mesafe||0, foUtp: b0.foUtp||0
    };
    saveData();
  }
  return s.buildingInfo;
}
function numField(b, field, label, hint){
  return `<div class="field-row">
    <label>${esc(label)}${hint?`<span class="hint">${esc(hint)}</span>`:''}</label>
    <input type="number" min="0" inputmode="numeric" value="${b[field]??0}" oninput="setBuildingInfoField('${field}',this.value,true)">
  </div>`;
}
function textField(b, field, label, placeholder){
  return `<div class="field-row">
    <label>${esc(label)}</label>
    <input type="text" placeholder="${esc(placeholder||'')}" value="${esc(b[field]||'')}" oninput="setBuildingInfoField('${field}',this.value,false)">
  </div>`;
}
function selectField(b, field, label, options){
  let opts = options.map(o=>`<option value="${esc(o)}" ${b[field]===o?'selected':''}>${o===''?'— Seçiniz —':esc(o)}</option>`).join('');
  return `<div class="field-row">
    <label>${esc(label)}</label>
    <select onchange="setBuildingInfoField('${field}',this.value,false)">${opts}</select>
  </div>`;
}
function autoField(label, value, hint){
  return `<div class="field-row">
    <label>${esc(label)}${hint?`<span class="hint">${esc(hint)}</span>`:''}</label>
    <div class="auto-value mono">${value}</div>
  </div>`;
}

      ${autoField('Öğretmenler Odası', ogretmenler, '3×RJ45, 1×AP')}

      ${numField(b,'mesafe','Ek Binaya Mesafe (m)','Dışarıda, 0-999m')}

    <div class="cell"><span class="num mono">${t.floors}</span><span class="lbl">Kat</span></div>
    <div class="cell"><span class="num mono">${t.rooms}</span><span class="lbl">Oda</span></div>

        <button class="building-del" onclick="event.stopPropagation();deleteBuilding('${building.id}')">✕</button>
      </div>`;

      html += `<div class="building-body">`;

        html += `<div style="font-size:12px;color:var(--ink-soft);padding:2px 2px 12px;">Bu binaya henüz kat eklenmedi.</div>`;

        html += renderFloorCard(floor);

function renderFloorCard(floor){
  const fc = computeFloor(floor);
  const floorOpen = floor.open!==false;
  let html = `<div class="floor">
    <div class="floor-head">
      <div class="floor-title" onclick="toggleFloor('${floor.id}')">
        <span class="floor-chevron">${floorOpen?'▾':'▸'}</span>
        <span class="floor-name">${esc(floor.name)}</span>
      </div>
      <button class="floor-edit" onclick="event.stopPropagation();promptRenameFloor('${floor.id}')">✎</button>
      <button class="floor-del" onclick="event.stopPropagation();deleteFloor('${floor.id}')">✕</button>
    </div>`;
  if(floorOpen){
    html += `<div class="floor-body">`;
    if((floor.rooms||[]).length===0){
      html += `<div style="font-size:12px;color:var(--ink-soft);padding:6px 2px 10px;">Bu kata henüz oda eklenmedi.</div>`;
    }
    (floor.rooms||[]).forEach(room=>{
      html += renderRoomRow(floor.id, room);
    });
    html += `<button class="add-room-btn" onclick="openPicker('${floor.id}')">+ Oda Ekle</button>`;
    html += `</div>`;
  }
  html += `<div class="floor-summary">
    <span>Oda: <b>${fc.rooms}</b></span>
    <span>Data: <b>${fc.data}</b></span>
    <span>Enerji: <b>${fc.enerji}</b></span>
    <span>AP: <b>${fc.ap}</b></span>
  </div>`;
  html += `</div>`;
  return html;
}

function roomLabel(room){
  if(room.custom) return {name:room.customName||'Manuel oda', cat:'Manuel giriş'};
  const entry = CATALOG.find(e=>e.id===room.catalogId);
  if(!entry) return {name:'Bilinmeyen', cat:''};
  return {name:entry.label, cat:entry.excluded?'Data ucu çekilmeyecek alan':(entry.sub==='Temel kategori'?'':entry.sub)};
}

function renderRoomRow(floorId, room){
  const c = computeRoom(room);
  const lab = roomLabel(room);
  const entry = room.custom? null : CATALOG.find(e=>e.id===room.catalogId);
  const isP1 = entry && !room.custom && CAT_BY_KEY[entry.catKey] && CAT_BY_KEY[entry.catKey].data==='p1' && entry.dataOverride==null;

  let badges = '';
  if(c.excluded){ badges += `<span class="badge excl">çekilmez</span>`; }
  else{
    badges += `<span class="badge data">${c.dataTotal} data</span>`;
    if(c.enerjiTotal>0) badges += `<span class="badge enerji">${c.enerjiTotal} enerji</span>`;
    if(c.apTotal>0) badges += `<span class="badge ap">${c.apTotal} AP</span>`;
  }

  let controls = `<div class="room-controls">
    <span class="stepper-label">Adet</span>
    <div class="stepper">
      <button onclick="changeAdet('${floorId}','${room.id}',-1)">−</button>
      <span class="val mono">${room.adet||1}</span>
      <button onclick="changeAdet('${floorId}','${room.id}',1)">+</button>
    </div>`;
  if(isP1 && !c.excluded){
    controls += `<span class="stepper-label">Personel</span>
    <div class="stepper">
      <button onclick="changePersonel('${floorId}','${room.id}',-1)">−</button>
      <span class="val mono">${room.personel||0}</span>
      <button onclick="changePersonel('${floorId}','${room.id}',1)">+</button>
    </div>`;
  }
  controls += `<div style="margin-left:auto;display:flex;gap:5px;">${badges}</div></div>`;
  if(c.capped){ controls += `<div class="cap-warn">Personel sayısına göre hesap 5 sınırına düşürüldü</div>`; }
  if(c.excluded){ controls += `<div class="cap-warn">Bu alana normalde data ucu çekilmez — gerekiyorsa merkezi kontrol teşkilatı onayı gerekir.</div>`; }

  const isBt = entry && !room.custom && entry.catKey==='bt' && !c.excluded;
  if(isBt){
    const on = !!room.akilliTahta;
    controls += `<div class="akilli-toggle">
      <span class="lbl">Akıllı Tahta</span>
      <button class="${on?'on':''}" onclick="toggleAkilliTahta('${floorId}','${room.id}')">${on?'Var — 1 enerji ekli':'Yok'}</button>
    </div>`;
  }

  return `<div class="room-row">
    <div class="top">
      <div class="rlabel">
        <div class="name">${esc(lab.name)}</div>
        ${lab.cat?`<div class="cat">${esc(lab.cat)}</div>`:''}
      </div>
      <button class="room-del" onclick="deleteRoom('${floorId}','${room.id}')">✕</button>
    </div>
    ${controls}
    <input class="note-input" placeholder="Oda adı / numarası (ör. 101, Zemin kat sol koridor)" value="${esc(room.note||'')}" oninput="setRoomNote('${floorId}','${room.id}',this.value)">
  </div>`;
}

/* ---- Oda seçici (arama) ---- */
function renderPicker(){
  const q = PICKER_QUERY.trim().toLowerCase();
  let results = CATALOG;
  if(q){
    results = CATALOG.filter(e=> e.label.toLowerCase().includes(q) || (e.sub&&e.sub.toLowerCase().includes(q)) );
  }
  results = results.slice(0,60);
  let items = results.map(e=>{
    let tags='';
    if(e.excluded){ tags='<span class="badge excl">çekilmez</span>'; }
    else{
      const cat = CAT_BY_KEY[e.catKey];
      const dtxt = e.dataOverride!=null? e.dataOverride : (cat.data==='p1'?'P+1':cat.data);
      tags = `<span class="badge data">${dtxt}</span>`;
      if(cat.ap) tags += `<span class="badge ap">AP</span>`;
      if(cat.enerji) tags += `<span class="badge enerji">enerji</span>`;
    }
    return `<div class="picker-item ${e.excluded?'excluded':''}" onclick="pickCatalog('${e.id.replace(/'/g,"\\'")}')">
      <div><div class="pname">${esc(e.label)}</div>${e.sub?`<div class="pcat">${esc(e.sub)}</div>`:''}</div>
      <div class="ptags">${tags}</div>
    </div>`;
  }).join('');
  if(results.length===0){
    items = `<div class="picker-custom">"${esc(PICKER_QUERY)}" listede bulunamadı.<br>Şartnamede tanımsız alanlara data ucu çekilmez; ihtiyaç varsa merkezi kontrol teşkilatı onayı gerekir.<br>
    <button onclick="pickCustom()">Yine de manuel oda olarak ekle</button></div>`;
  }

  const html = `<div class="picker-backdrop" onclick="closePickerIfBackdrop(event)">
    <div class="picker">
      <div class="picker-head">
        <h3>Oda türü seç</h3>
        <input autofocus placeholder="Sahada gördüğün oda adını yaz (ör. Fen Odası)" value="${esc(PICKER_QUERY)}" oninput="PICKER_QUERY=this.value; renderPickerOnly();">
      </div>
      <div class="picker-list" id="pickerList">${items}</div>
      <div class="picker-close" onclick="closePicker()">Kapat</div>
    </div>
  </div>`;
  let holder = document.getElementById('pickerHolder');
  if(!holder){ holder = document.createElement('div'); holder.id='pickerHolder'; document.body.appendChild(holder); }
  holder.innerHTML = html;
  const inputEl = holder.querySelector('.picker-head input');
  if(inputEl){ const pos=inputEl.value.length; inputEl.focus(); inputEl.setSelectionRange(pos,pos); }
}
function renderPickerOnly(){ renderPicker(); }
window.closePickerIfBackdrop = function(ev){ if(ev.target.classList.contains('picker-backdrop')) closePicker(); };
window.closePicker = function(){ PICKER_FOR=null; PICKER_QUERY=''; const h=document.getElementById('pickerHolder'); if(h) h.innerHTML=''; };

window.pickCatalog = function(catalogId){
  const r = findFloor(PICKER_FOR); if(!r) return;
  const entry = CATALOG.find(e=>e.id===catalogId);

window.pickCustom = function(){
  const r = findFloor(PICKER_FOR); if(!r) return;
  r.floor.rooms.push({id:uid(), custom:true, customName:PICKER_QUERY||'Manuel oda', customData:1, customEnerji:false, customAp:false, adet:1});
  closePicker(); saveData(); render();
};
window.deleteRoom = function(floorId, roomId){
  const r = findFloor(floorId); if(!r) return;
  r.floor.rooms = r.floor.rooms.filter(x=>x.id!==roomId);
  saveData(); render();
};
window.changeAdet = function(floorId, roomId, delta){
  const r = findFloor(floorId); if(!r) return;
  const room = r.floor.rooms.find(x=>x.id===roomId);
  room.adet = Math.max(1, (room.adet||1)+delta);
  saveData(); render();
};
window.changePersonel = function(floorId, roomId, delta){
  const r = findFloor(floorId); if(!r) return;
  const room = r.floor.rooms.find(x=>x.id===roomId);
  room.personel = Math.max(0, (room.personel||0)+delta);
  saveData(); render();
};
window.setRoomNote = function(floorId, roomId, val){
  const r = findFloor(floorId); if(!r) return;
  const room = r.floor.rooms.find(x=>x.id===roomId);
  room.note = val; saveData();
};
window.toggleAkilliTahta = function(floorId, roomId){
  const r = findFloor(floorId); if(!r) return;
  const room = r.floor.rooms.find(x=>x.id===roomId);
  room.akilliTahta = !room.akilliTahta;
  saveData(); render();
};

function showToast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}

window.copySummary = function(){
  const s = SCHOOLS[CURRENT_ID];
  const t = computeSchool(s);
  let lines = [];
  lines.push(s.name);
  lines.push('Toplam: '+t.buildings+' bina, '+t.floors+' kat, '+t.rooms+' oda, '+t.data+' data ucu, '+t.enerji+' enerji ucu, '+t.ap+' AP ucu');
  const pano = panoInfo(t.enerji);
  if(pano.durum==='tek') lines.push('Enerji Panosu: Tip-'+pano.tip+' (en fazla '+pano.limit+' derslik prizi)');
  else if(pano.durum==='cift') lines.push('Enerji Panosu: 2 pano gerekir — Ana Tip-'+pano.anaTip+', İkinci Tip-'+pano.ikinciTip);
  lines.push('');
  (s.buildings||[]).forEach(building=>{
    const bc = computeBuilding(building);
    lines.push('■ '+building.name+' ('+bc.floors+' kat, '+bc.rooms+' oda, '+bc.data+' data, '+bc.enerji+' enerji, '+bc.ap+' AP)');
    (building.floors||[]).forEach(floor=>{
      const fc = computeFloor(floor);
      lines.push('  — '+floor.name+' ('+fc.rooms+' oda, '+fc.data+' data, '+fc.enerji+' enerji, '+fc.ap+' AP)');
      (floor.rooms||[]).forEach(room=>{
        const c = computeRoom(room);
        const lab = roomLabel(room);
        const adet = room.adet||1;
        let seg = '     '+lab.name+(room.note?' — '+room.note:'')+(adet>1?' x'+adet:'');
        if(c.excluded){ seg += ' — data ucu çekilmez'; }
        else{
          seg += ' — '+c.dataTotal+' data';
          if(c.enerjiTotal) seg += ', '+c.enerjiTotal+' enerji';
          if(c.apTotal) seg += ', '+c.apTotal+' AP';
        }
        lines.push(seg);
      });
    });
  });
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('Özet panoya kopyalandı')).catch(()=>showToast('Kopyalanamadı'));
  } else { showToast('Kopyalama desteklenmiyor'); }
};

/* ================= ANA EKRANA EKLE ================= */
let DEFERRED_INSTALL_PROMPT = null;

function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  DEFERRED_INSTALL_PROMPT = e;
});

window.addEventListener('appinstalled', ()=>{
  DEFERRED_INSTALL_PROMPT = null;
  showToast('Uygulama ana ekrana eklendi');
});

function detectPlatform(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const isAndroid = /Android/.test(ua);
  return {isIOS, isAndroid};
}

window.handleInstallClick = async function(){
  if(isStandaloneMode()){
    showToast('Uygulama zaten ana ekranda açık');
    return;
  }
  if(DEFERRED_INSTALL_PROMPT){
    DEFERRED_INSTALL_PROMPT.prompt();
    const choice = await DEFERRED_INSTALL_PROMPT.userChoice;
    DEFERRED_INSTALL_PROMPT = null;
    if(choice && choice.outcome==='accepted'){ showToast('Ekleniyor…'); }
    return;
  }
  showManualInstallModal();
};

function showManualInstallModal(){
  const {isIOS, isAndroid} = detectPlatform();
  let stepsHtml = '';
  let title = 'Ana Ekrana Ekle';
  let sub = '';

  if(isIOS){
    sub = 'iPhone / iPad — Safari üzerinden';
    stepsHtml = `
      <li><span class="num">1</span><div>Bu sayfayı <b>Safari</b> ile açtığından emin ol (Chrome'da bu adım çalışmaz).</div></li>
      <li><span class="num">2</span><div>Alt (veya üst) çubuktaki <b>Paylaş</b> simgesine dokun — kare içinden yukarı ok.</div></li>
      <li><span class="num">3</span><div>Açılan listede aşağı kaydır, <b>"Ana Ekrana Ekle"</b> seçeneğine dokun.</div></li>
      <li><span class="num">4</span><div><b>Ekle</b>'ye dokun. Simge ana ekranında görünecek.</div></li>
    `;
  } else if(isAndroid){
    sub = 'Android — Chrome üzerinden';
    stepsHtml = `
      <li><span class="num">1</span><div>Dosyayı bir "Dosyalar" uygulamasından değil, Chrome'un <b>İndirilenler</b> sayfasından (chrome://downloads) açmayı dene — adres çubuğunda gerçek bir adres görünmeli.</div></li>
      <li><span class="num">2</span><div>Sağ üstteki <b>⋮</b> menüsüne dokun.</div></li>
      <li><span class="num">3</span><div>Listede <b>"Ana ekrana ekle"</b> ya da <b>"Uygulamayı yükle"</b> seçeneğini bul (menüde aşağı kaydırman gerekebilir).</div></li>
      <li><span class="num">4</span><div>Bu seçenek çıkmıyorsa, sayfa yerel bir dosyadan (content://) açılıyor demektir — Chrome bu durumda otomatik yükleme sunmaz; yine de simgesiz bir kısayol eklemeyi deneyebilirsin.</div></li>
    `;
  } else {
    sub = 'Bilgisayar — Chrome/Edge üzerinden';
    stepsHtml = `
      <li><span class="num">1</span><div>Adres çubuğunun sağındaki <b>yükle simgesine</b> (⊕ veya bilgisayar ikonu) tıkla.</div></li>
      <li><span class="num">2</span><div>Görünmüyorsa sağ üst <b>⋮</b> menüsünden <b>"Uygulamayı yükle"</b> seçeneğini kullan.</div></li>
    `;
  }

  const note = (!isIOS && !isAndroid) ? '' : `<div class="note">Not: Bu buton, tarayıcının otomatik yükleme penceresini açmaya çalışır. Cihazın/tarayıcın bunu desteklemiyorsa (ör. dosya yerel bir klasörden açıldıysa) aşağıdaki adımları elle takip etmen gerekir.</div>`;

  const html = `<div class="install-modal-backdrop" onclick="closeInstallModalIfBackdrop(event)">
    <div class="install-modal">
      <h3>${title}</h3>
      <div class="sub2">${sub}</div>
      ${note}
      <ul class="steps">${stepsHtml}</ul>
      <button class="closebtn" onclick="closeInstallModal()">Anladım</button>
    </div>
  </div>`;
  let holder = document.getElementById('installModalHolder');
  if(!holder){ holder = document.createElement('div'); holder.id='installModalHolder'; document.body.appendChild(holder); }
  holder.innerHTML = html;
}
window.closeInstallModalIfBackdrop = function(ev){ if(ev.target.classList.contains('install-modal-backdrop')) closeInstallModal(); };
window.closeInstallModal = function(){ const h=document.getElementById('installModalHolder'); if(h) h.innerHTML=''; };

const INSTALLBAR_DISMISS_KEY = 'sahaKesifInstallBarDismissed';

window.dismissInstallBar = function(){
  const bar = document.getElementById('installBar');
  if(bar) bar.style.display = 'none';
  document.body.classList.remove('has-installbar');
  try{ localStorage.setItem(INSTALLBAR_DISMISS_KEY, '1'); }catch(e){}
};

function updateInstallBtnVisibility(){
  const btn = document.getElementById('installBtn');
  const bar = document.getElementById('installBar');
  const standalone = isStandaloneMode();
  if(btn) btn.style.display = standalone ? 'none' : 'flex';

  if(bar){
    let dismissed = false;
    try{ dismissed = localStorage.getItem(INSTALLBAR_DISMISS_KEY)==='1'; }catch(e){}
    const show = !standalone && !dismissed;
    bar.style.display = show ? 'flex' : 'none';
    document.body.classList.toggle('has-installbar', show);
  }
}

/* ================= BAŞLAT ================= */
(async function init(){
  app.innerHTML = `<div class="empty-hint">Yükleniyor…</div>`;
  await loadData();
  render();
  updateInstallBtnVisibility();
})();
</script>
